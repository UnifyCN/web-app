# Dependabot keeps our GitHub Actions up to date. Because the workflow pins each
# action to a commit SHA with a `# vX.Y.Z` comment (see .github/workflows/), the
# github-actions ecosystem bumps the SHA *and* the comment together to the new
# release — so pins never rot while staying immutable.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    # For the github-actions ecosystem, "/" scans all workflows under .github/workflows.
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # Match the repo convention (e.g. "ci: ...") for workflow changes.
      prefix: "ci"
    open-pull-requests-limit: 5
    # Collapse all action bumps into one PR to keep review noise low.
    groups:
      github-actions:
        patterns:
          - "*"
