# Supabase CLI config for the web project. Generated minimally for edge-function
# deploys; `supabase link` populates the rest if you run a fuller init later.
#
# Canonical production DB is the shared project wrbauxutkysljmsqojts (web + mobile on
# one database) since the PR #31 DB cutover. The original web-only project
# pbiszrycmcxmzxrnkkwr is retired and no longer used by the app.
project_id = "wrbauxutkysljmsqojts"

[functions.rag-query]
# Auth is enforced inside the function (resolveAuthenticatedUserId validates the
# user's JWT and 401s if missing/invalid). verify_jwt is disabled at the gateway
# so the browser CORS preflight (OPTIONS, no Authorization header) isn't rejected
# before reaching the function's own OPTIONS handler.
verify_jwt = false

[functions.rag-query-web]
# Web-dedicated Companion function (mobile keeps calling rag-query). Same rationale
# as rag-query: it validates the JWT itself (resolveAuthenticatedUserId) and 401s if
# missing/invalid; gateway JWT off so the browser CORS preflight (OPTIONS, no auth
# header) reaches the function's own OPTIONS handler.
verify_jwt = false

[functions.practice-feedback]
# Same rationale as rag-query: the function validates the user's JWT itself
# (supabase.auth.getUser) and 401s if missing/invalid. Gateway JWT off so the
# browser CORS preflight reaches the function's own OPTIONS handler.
verify_jwt = false

[functions.news-crawler]
# Cron-only (pg_cron → net.http_post; see 20260619130000_news_details_crawler.sql).
# The function authorizes itself by requiring the project service-role key as the
# Bearer token, so the gateway JWT check is disabled — the request carries the
# service-role key, not a user JWT, and there is no browser/CORS surface.
verify_jwt = false
