# Supabase CLI config for the web project. Generated minimally for edge-function
# deploys; `supabase link` populates the rest if you run a fuller init later.
#
# Canonical production DB is the shared project wrbauxutkysljmsqojts (web + mobile on
# one database) since the PR #31 DB cutover. The original web-only project
# pbiszrycmcxmzxrnkkwr is retired and no longer used by the app.
project_id = "wrbauxutkysljmsqojts"

[functions.rag-query]
# Unified Companion function (web + mobile) — we deploy it from this repo, so this
# block is authoritative for the deploy. verify_jwt stays ON: released mobile apps
# call it directly with a valid user JWT, and the web app calls it through the
# same-origin /api/companion proxy (a server→server invoke that forwards the user's
# JWT), so no unauthenticated browser preflight needs to reach it. The function
# also re-validates the JWT in-function (resolveAuthenticatedUserId) as
# defense-in-depth. Do NOT set this false — that would weaken the live function.
verify_jwt = true

[functions.practice-feedback]
# Same rationale as rag-query: the function validates the user's JWT itself
# (supabase.auth.getUser) and 401s if missing/invalid. Gateway JWT off so the
# browser CORS preflight reaches the function's own OPTIONS handler.
verify_jwt = false

[functions.news-crawler]
# Cron-only (pg_cron → net.http_post; see 20260619130000_news_details_crawler.sql).
# verify_jwt = true: the gateway verifies the bearer's signature, so the function can
# safely trust the JWT's `role` claim (must be service_role) in addition to an exact
# service-role-key match. Safe to enable here because this is cron-only — there is no
# browser/CORS preflight surface (the reason practice-feedback keeps it off). The cron
# sends the project service-role key (a valid JWT) as the Bearer token.
verify_jwt = true

[functions.events-crawler]
# Cron-only (pg_cron → net.http_post; see 20260724120000_events_crawler_cron.sql). Same
# rationale as news-crawler: cron-only, no browser/CORS preflight surface, so the
# gateway can verify the service-role bearer and the function trusts its `role` claim.
verify_jwt = true
