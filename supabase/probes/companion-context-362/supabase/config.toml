# Disposable local stack for the Companion context probe (#362). Not the app's
# config: its own project id and ports (59471-59473), so it cannot touch the
# default local stack, another probe or any hosted project.
project_id = "unify-context-362"

[api]
enabled = true
port = 59471
schemas = ["public", "probe_audit"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 59472
shadow_port = 59473
major_version = 17

[db.migrations]
enabled = true
[db.seed]
enabled = false

[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3010"
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6
[auth.email]
enable_signup = true
enable_confirmations = false
